{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl py-16 text-center">
  <h1 class="text-2xl font-semibold">Redirecting to eSewa…</h1>
  <p class="mt-2 text-muted-foreground">Please wait while we send you to the eSewa payment page.</p>
  <form id="esewa-payment" method="post" action="{{ action }}">
    {% for name, value in fields.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <noscript><button type="submit">Continue to eSewa</button></noscript>
  </form>
</div>
<script>document.getElementById("esewa-payment").submit();</script>
{% endblock content %}
